<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>countdown to 5th grade</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: sans-serif;
  overflow: hidden;
}

/* タイマー */
#timer {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 30px;
  z-index: 100;
}

/* コメントエリア（全画面） */
#commentArea {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* コメント */
.comment {
  position: absolute;
  white-space: nowrap;
  animation: move linear forwards;
}

/* 流れる */
@keyframes move {
  from { left: 100%; }
  to { left: -100%; }
}

/* 入力UI */
#ui {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
}
</style>
</head>

<body>

<div id="timer"></div>
<div id="commentArea"></div>

<div id="ui">
  <input id="text">
  
  <select id="color">
    <option value="red">赤</option>
    <option value="orange">オレンジ</option>
    <option value="yellow">黄</option>
    <option value="green">緑</option>
    <option value="blue">青</option>
    <option value="indigo">藍</option>
    <option value="violet">紫</option>
  </select>

  <select id="size">
    <option value="40px">デカい</option>
    <option value="25px">普通</option>
    <option value="15px">小さい</option>
  </select>

  <select id="position">
    <option value="top">上</option>
    <option value="middle">真ん中</option>
    <option value="bottom">下</option>
  </select>

  <button onclick="sendComment()">送信</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabase = supabase.createClient(
  "https://ukjqldnwrncysmtczwpe.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVranFsZG53cm5jeXNtdGN6d3BlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3MzUyMjUsImV4cCI6MjA4OTMxMTIyNX0.16mStjH0sKVqYVYKpbOBqh24XjhFtJ_0Q3rP7ZNyNq4"
);

// ===== コメント送信 =====
async function sendComment() {
  const data = {
    text: text.value,
    color: color.value,
    size: size.value,
    position: position.value
  };

  await supabase.from("comments").insert([data]);
  text.value = "";
}

// ===== リアルタイム受信 =====
supabase
  .channel("comments")
  .on(
    "postgres_changes",
    { event: "INSERT", schema: "public", table: "comments" },
    (payload) => {
      createComment(payload.new);
    }
  )
  .subscribe();
</script>

</body>
</html>
