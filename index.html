<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>countdown to 5th grade</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: sans-serif;
  overflow: hidden;
}

/* タイマー */
#timer {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 30px;
  z-index: 100;
}

/* コメントエリア（全画面） */
#commentArea {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* コメント */
.comment {
  position: absolute;
  white-space: nowrap;
  animation: move linear forwards;
}

/* 流れる */
@keyframes move {
  from { left: 100%; }
  to { left: -100%; }
}

/* 入力UI */
#ui {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
}
</style>
</head>

<body>

<div id="timer"></div>
<div id="commentArea"></div>

<div id="ui">
  <input id="text">
  
  <select id="color">
    <option value="red">赤</option>
    <option value="orange">オレンジ</option>
    <option value="yellow">黄</option>
    <option value="green">緑</option>
    <option value="blue">青</option>
    <option value="indigo">藍</option>
    <option value="violet">紫</option>
  </select>

  <select id="size">
    <option value="40px">デカい</option>
    <option value="25px">普通</option>
    <option value="15px">小さい</option>
  </select>

  <select id="position">
    <option value="top">上</option>
    <option value="middle">真ん中</option>
    <option value="bottom">下</option>
  </select>

  <button onclick="sendComment()">送信</button>
</div>

<script>
// ===== カウントダウン =====
const target = new Date("2026-03-20T00:00:00");

function updateTimer() {
  const now = new Date();
  const diff = target - now;

  const d = Math.floor(diff / (1000*60*60*24));
  const h = Math.floor(diff / (1000*60*60)) % 24;
  const m = Math.floor(diff / (1000*60)) % 60;
  const s = Math.floor(diff / 1000) % 60;

  document.getElementById("timer").innerText =
    `${d}日 ${h}時間 ${m}分 ${s}秒`;
}
setInterval(updateTimer, 1000);
updateTimer();

// ===== WebSocket =====
const ws = new WebSocket("ws://localhost:3000");

ws.onmessage = (e) => {
  const data = JSON.parse(e.data);
  createComment(data);
};

// ===== コメント生成 =====
function createComment(data) {
  const el = document.createElement("div");
  el.className = "comment";
  el.innerText = data.text;

  el.style.color = data.color;
  el.style.fontSize = data.size;

  // 位置
  if (data.position === "top") {
    el.style.top = "0px";
  } else if (data.position === "bottom") {
    el.style.bottom = "0px";
  } else {
    el.style.top = Math.random() * window.innerHeight + "px";
  }

  // 速度（ランダム）
  const duration = 5 + Math.random() * 5;
  el.style.animationDuration = duration + "s";

  document.getElementById("commentArea").appendChild(el);

  setTimeout(() => el.remove(), duration * 1000);
}

// ===== 送信 =====
function sendComment() {
  const data = {
    text: document.getElementById("text").value,
    color: document.getElementById("color").value,
    size: document.getElementById("size").value,
    position: document.getElementById("position").value
  };

  ws.send(JSON.stringify(data));
  document.getElementById("text").value = "";
}
</script>

</body>
</html>
